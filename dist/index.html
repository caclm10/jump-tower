<script>

<script>
'use strict';
(function(){
const C=JT.Config;
class Session{
 constructor(){this.restart();this.mode='menu';}

 load(data){if(!data)return false;this.player=data.player;this.stats=data.stats;this.completed=data.completed;this.mode=data.completed?'victory':'playing';return true;}
 pause(){if(this.mode==='playing'){this.mode='paused';this.player.charging=false;this.player.charge=0;return true;}return false;}
 resume(){if(this.mode==='paused'){this.mode='playing';return true;}return false;}
 tick(input,dt=C.step){
  if(this.mode!=='playing')return;
  const p=this.player;JT.Physics.step(p,input,dt);this.stats.time+=dt;
  if(p.jumped)this.stats.jumps++;
  if(p.fell)this.stats.falls++;
  this.stats.highest=Math.max(this.stats.highest,JT.Util.height(p.y));
  if(p.grounded&&p.platformId===JT.World.summit.id){this.completed=true;this.mode='victory';p.state='victory';}
 }
}
JT.Session=Session;
})();

</script>

   for(let i=1;i<4;i++)this.rect(x-10+i*8,by+1,1,3,'#172431');
   if(amount>=1)this.rect(x+3,y-9+Math.sin(this.time*14),5,2,'#ffe5a9');
  }
 }
 burst(x,y,color,count=7){if(!this.settings.particles)return;for(let i=0;i<count;i++)this.particles.push({x,y,vx:(hash(i+this.time)*2-1)*35,vy:-15-hash(i+this.time+3)*30,life:0.4+hash(i)*0.4,color});if(this.particles.length>90)this.particles.splice(0,this.particles.length-90);}
 render(session,camera,alpha,dt){
  this.time+=dt;const g=this.ctx,p=session.player,cam=Math.round(camera.previous+(camera.y-camera.previous)*alpha),r=W.getRegion(p.y);
  this.backdrop(cam,r);
  if(cam>C.floor-500){
   const ground=C.floor-cam;
   // A small, abandoned village: roof tiles, warm windows, and the old well.
   this.rect(333,ground-51,74,51,'#344c4c');this.rect(325,ground-55,90,6,'#687b6b');
   this.rect(331,ground-61,78,6,'#596e64');this.rect(339,ground-67,62,6,'#4c635e');
   this.rect(360,ground-34,15,34,'#1b3037');this.rect(345,ground-39,9,12,'#c6a578');
   this.rect(384,ground-39,9,12,'#c6a578');this.rect(349,ground-39,1,12,'#6c6657');
   this.rect(388,ground-39,1,12,'#6c6657');this.rect(381,ground-78,8,18,'#536962');
   this.rect(28,ground-19,30,19,'#526c61');this.rect(25,ground-22,36,4,'#8fa783');
   this.rect(30,ground-45,2,23,'#6f806a');this.rect(54,ground-45,2,23,'#6f806a');
   this.rect(26,ground-47,34,3,'#91a482');this.rect(42,ground-44,1,20,'#a5aa87');
  }
  g.save();if(this.settings.shake&&this.shake>0){g.translate(Math.round(Math.sin(this.time*83)*this.shake),Math.round(Math.cos(this.time*77)*this.shake));this.shake=Math.max(0,this.shake-dt*16);}
  const first=U.clamp(Math.floor((C.floor-cam-JT.View.height)/400)-1,0,W.areas.length-1),last=U.clamp(Math.floor((C.floor-cam)/400)+1,0,W.areas.length-1);
  for(let a=first;a<=last;a++)this.landmark(W.areas[a],cam);
  W.eachNear(cam-35,cam+JT.View.height+30,q=>{if(q.y+q.h>=cam-35&&q.y<=cam+JT.View.height+30)this.platform(q,cam);});
  // Beacon at the single, reachable destination.
  const sy=W.summit.y-cam;
  if(sy>-60&&sy<380){this.rect(236,sy-48,8,48,'#535369');this.rect(229,sy-20,22,4,'#adb0bf');this.rect(232,sy-52,16,8,'#eee0bf');const f=Math.sin(this.time*9)*2;this.rect(235,sy-62+f,10,12,'#efb578');this.rect(238,sy-67+f,4,13,'#fff0b7');g.globalAlpha=0.08+Math.sin(this.time*2)*0.02;this.rect(208,sy-80,64,75,'#ffe1a4');g.globalAlpha=1;}
  const ip=this.interpolated;Object.assign(ip,p);ip.x=this.oldX+(p.x-this.oldX)*alpha;ip.y=this.oldY+(p.y-this.oldY)*alpha;this.sprite(ip,cam,session.completed);
  for(let i=this.particles.length-1;i>=0;i--){const q=this.particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=70*dt;g.globalAlpha=Math.min(1,q.life*3);this.rect(q.x,q.y-cam,2,2,q.color);if(q.life<=0)this.particles.splice(i,1);}g.globalAlpha=1;
  g.restore();
  // A fine vignette frames the scene without hiding platform edges.
  g.fillStyle='#101a29';g.globalAlpha=0.18;g.fillRect(0,0,480,6);g.fillRect(0,JT.View.height-6,480,6);g.globalAlpha=1;
 }
 title(dt){
  this.time+=dt;const g=this.ctx;g.save();g.scale(1,JT.View.height/300);
  this.rect(0,0,480,300,'#152630');
  this.rect(0,200,480,100,'#20343a');
  // Pixel moon and original impossible-looking (decorative) tower silhouette.
  this.rect(344,34,50,50,'#a2b4ae');this.rect(337,42,64,34,'#a2b4ae');this.rect(351,28,36,62,'#a2b4ae');this.rect(352,37,25,5,'#bac6b5');this.rect(382,51,9,16,'#899f9f');
  this.rect(323,65,42,211,'#31464b');this.rect(313,99,62,8,'#526568');this.rect(315,151,58,7,'#526568');this.rect(316,207,56,7,'#526568');
  this.rect(332,40,24,28,'#3d5558');this.rect(327,60,34,6,'#6b7e77');this.rect(338,26,12,17,'#58716c');
  this.rect(341,17,5,11,'#dfb97d');this.rect(339,21,9,4,'#f1dba4');
  for(let i=0;i<5;i++){this.rect(331,80+i*36,7,14,'#192c36');this.rect(350,80+i*36,6,14,'#192c36');if(i===2)this.rect(350,80+i*36,6,14,'#d4af78');}
  this.rect(335,251,19,27,'#14262f');this.rect(338,247,13,6,'#14262f');
  this.rect(287,167,22,110,'#263e44');this.rect(282,164,32,5,'#566b63');this.rect(381,195,22,88,'#293f45');this.rect(378,190,28,7,'#64776b');
  for(let i=0;i<12;i++){const x=250+i*21,y=270+hash(i)*13;this.rect(x,y,24,31,'#243d40');this.rect(x+2,y-3,19,4,'#7a987c');}
  // Floating climb fragments lead the eye upward.
  [[290,233,29],[397,163,28],[294,127,26],[372,87,24]].forEach(([x,y,w],i)=>{this.rect(x,y,w,7,'#586c64');this.rect(x,y,w,2,'#b0b59a');this.rect(x+3,y+7,3,9,'#31484a');});
  if(this.settings.particles)for(let i=0;i<30;i++){const x=240+hash(i+9)*240,y=(hash(i+50)*300-this.time*2+300)%300;g.globalAlpha=0.25+0.25*Math.sin(i+this.time);this.rect(x,y,1,1,'#efd9a8');}g.globalAlpha=1;
  const faux={x:301,y:247,w:12,h:20,state:'idle',walkTime:0,charge:0,facing:1};this.sprite(faux,0);
  const shade=g.createLinearGradient(0,0,360,0);shade.addColorStop(0,'#12222cf5');shade.addColorStop(0.6,'#12222cdd');shade.addColorStop(1,'#12222c00');g.fillStyle=shade;g.fillRect(0,0,480,300);g.restore();
 }
}
JT.Renderer=Renderer;
})();

</script>
<script>
'use strict';
(function(){
const $=id=>document.getElementById(id),U=JT.Util;
class UI{
 constructor(game){this.game=game;this.screen=$('screen');this.hud=$('hud');this.returnTo='menu';this.confirmReturn='menu';this.toastTimer=0;this.lastArea=-1;this.lastRegion=-1;this.noticeTimer=0;
 $('pause-button').onclick=()=>game.pause();
 this.screen.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){game.audio.unlock();game.audio.sfx('menu');this.action(b.dataset.action);}});
 this.screen.addEventListener('input',e=>{const k=e.target.dataset.setting;if(!k)return;game.settings[k]=e.target.type==='checkbox'?e.target.checked:Number(e.target.value);game.audio.apply();game.persistSettings();this.updateHud();});
 }
 button(label,action,primary=false,disabled=false){return `<button class="button${primary?' primary':''}" data-action="${action}" ${disabled?'disabled':''}><span>${label}</span><span class="arrow" aria-hidden="true">${primary?'↗':'›'}</span></button>`;}
 show(page){
  this.page=page;const g=this.game,s=g.session;
  this.screen.classList.toggle('shaded',page!=='menu'&&page!=='');
  if(!page){this.screen.innerHTML='';this.hud.hidden=!g.settings.hud;g.canvas.focus({preventScroll:true});return;}
  this.hud.hidden=true;
  const btn=(...args)=>this.button(...args),back=btn('Back','back');let html='';
  if(page==='menu'){
   const saved=g.saved;
   html=`<div class="title-menu"><div class="eyebrow">50 AREAS · ONE UNBROKEN CLIMB</div><h1>JUMP<span>TOWER</span></h1><p class="tagline">Carry a little light a long way.</p><p class="description">An unforgiving journey above the clouds.</p><div class="title-actions">${btn('Start game','start',!saved)}${saved?btn('Continue <small>· '+U.height(saved.player.y)+' m</small>','continue',true):btn('Continue','continue',false,true)}<div class="button-row">${btn('Settings','settings')}${btn('Controls','controls')}</div><button class="text-button" data-action="reset" ${saved?'':'disabled'}>Reset progress</button></div></div><div class="title-bottom"><span>NO CHECKPOINTS. EVERY STEP IS YOURS.</span><span>VOL. 01 / THE LANTERN COURIER</span></div>`;
  }else if(page==='paused'){
   html=`<div class="panel"><div class="eyebrow">TAKE A BREATH</div><h2>The tower can wait.</h2><p>${JT.World.getRegion(s.player.y).name} · ${U.height(s.player.y)} m<br>Your journey is saved on this device.</p>${btn('Resume journey','resume',true)}${btn('Settings','settings')}${btn('Controls','controls')}${btn('Restart from the village','restart')}${btn('Return to main menu','menu')}</div>`;
  }else if(page==='settings'){
   const settings=g.settings;
   html=`<div class="panel"><div class="eyebrow">MAKE YOURSELF AT HOME</div><h2>Settings</h2><label class="setting">Sound effects <input aria-label="Sound effects volume" data-setting="sound" type="range" min="0" max="1" step="0.05" value="${settings.sound}"></label><label class="setting">Ambient music <input aria-label="Music volume" data-setting="music" type="range" min="0" max="1" step="0.05" value="${settings.music}"></label><div class="rule"></div>${[['hud','Show HUD · H'],['particles','Ambient particles'],['shake','Landing shake']].map(([k,label])=>`<label class="setting">${label}<input data-setting="${k}" type="checkbox" ${settings[k]?'checked':''}></label>`).join('')}<p>Settings and progress stay in your browser. Audio begins after your first interaction.</p>${back}</div>`;
  }else if(page==='controls'){
   html=`<div class="panel"><div class="eyebrow">THE ART OF THE ASCENT</div><h2>A leap of faith.</h2><div class="control"><span>Move / choose direction</span><span><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd></span></div><div class="control"><span>Charge / release to jump</span><kbd>SPACE</kbd></div><div class="control"><span>Pause / resume</span><kbd>ESC</kbd></div><div class="control"><span>Restart · with confirmation</span><kbd>R</kbd></div><div class="control"><span>Hide / show HUD</span><kbd>H</kbd></div><p class="tip">Hold Space while standing still. Release with a direction for a long jump; release with neither for a vertical jump. Your momentum is fixed in the air.</p><p>A full charge takes 0.72 seconds. You can hold it as long as you need. No checkpoints, no lost lives. If you fall, keep climbing.</p>${back}</div>`;
  }else if(page==='confirm'){
   const reset=this.confirmKind==='reset';
   html=`<div class="panel"><div class="eyebrow">A FRESH BEGINNING</div><h2>${reset?'Let this journey go?':'Back to the village?'}</h2><p>${reset?'This removes your saved journey. Your settings stay.':'This replaces your saved journey and resets your time, jumps and height.'} There is no undo.</p>${btn(reset?'Erase saved progress':'Restart journey','confirm',true)}${btn('Keep my journey','cancel')}</div>`;
  }else if(page==='victory'){
   html=`<div class="panel victory-panel"><div class="victory-symbol">✦</div><div class="eyebrow">THE LAST LIGHT IS LIT</div><h2>You carried it home.</h2><p>Every fall. Every leap. All yours.</p><div class="rule"></div>${[['COMPLETION TIME',U.time(s.stats.time)],['JUMPS',s.stats.jumps],['TOTAL FALLS',s.stats.falls],['HIGHEST POINT',Math.round(s.stats.highest)+' m']].map(([k,v])=>`<div class="run-stat"><span>${k}</span><strong>${v}</strong></div>`).join('')}<div class="rule"></div>${btn('Carry the light again','restart',true)}${btn('Return to main menu','menu')}</div>`;
  }
  this.screen.innerHTML=html;
  requestAnimationFrame(()=>{const el=this.screen.querySelector('button:not(:disabled),input');if(el)el.focus({preventScroll:true});});
 }
 action(action){const g=this.game;
  if(action==='start'){if(g.saved){this.confirmKind='restart';this.confirmReturn='menu';this.show('confirm');}else g.start();}
  else if(action==='continue')g.continue();
  else if(action==='resume')g.resume();
  else if(action==='settings'||action==='controls'){this.returnTo=this.page;this.show(action);}
  else if(action==='back')this.show(this.returnTo);
  else if(action==='menu')g.menu();
  else if(action==='reset'||action==='restart'){this.confirmKind=action;this.confirmReturn=this.page;this.show('confirm');}
  else if(action==='cancel')this.show(this.confirmReturn);
  else if(action==='confirm'){
   if(this.confirmKind==='reset'){const ok=JT.Save.clear();g.saved=null;this.show('menu');if(!ok)this.notice('Storage is unavailable. Progress could not be removed.');}
   else g.start();
  }
 }
 escape(){if(this.page==='settings'||this.page==='controls')this.show(this.returnTo);else if(this.page==='confirm')this.show(this.confirmReturn);else if(this.game.session.mode==='playing')this.game.pause();else if(this.page==='paused')this.game.resume();}
 updateHud(){const g=this.game,s=g.session,p=s.player,a=JT.World.getArea(p.y),r=JT.World.regions[a.region];
  this.hud.hidden=s.mode!=='playing'||!g.settings.hud;
  if(a.id!==this.lastArea){$('hud-area').textContent=String(a.id+1).padStart(2,'0')+' / '+a.name.toUpperCase();this.lastArea=a.id;}
  if(r.index!==this.lastRegion){$('hud-region').textContent=r.name;if(s.mode==='playing'&&this.lastRegion>=0){$('region-toast').innerHTML=r.name+'<small>'+r.subtitle+'</small>';$('region-toast').classList.add('visible');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>$('region-toast').classList.remove('visible'),4000);}this.lastRegion=r.index;}
  $('hud-height').textContent=U.height(p.y);$('hud-best').textContent=Math.round(s.stats.highest)+' m';$('hud-time').textContent=U.time(s.stats.time);$('hud-jumps').textContent=s.stats.jumps;
  const summitHeight=U.height(JT.World.summit.y-JT.Config.playerHeight),h=U.height(p.y)/summitHeight*100;$('altitude-fill').style.height=Math.min(100,s.stats.highest/summitHeight*100)+'%';$('altitude-marker').style.bottom=Math.min(100,h)+'%';$('tutorial').hidden=s.stats.highest>24||s.stats.jumps>5;
 }
 notice(message){$('notice').textContent=message;$('notice').hidden=false;clearTimeout(this.noticeTimer);this.noticeTimer=setTimeout(()=>$('notice').hidden=true,5500);}
}
JT.UI=UI;
})();

</script>
<script>
'use strict';
(function(){
const C=JT.Config;
class Game{
 constructor(){
  this.canvas=document.getElementById('game');this.settings=JT.Save.loadSettings();if(globalThis.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)this.settings.shake=false;
  this.session=new JT.Session();this.camera=new JT.Camera();this.renderer=new JT.Renderer(this.canvas,this.settings);this.audio=new JT.AudioManager(this.settings);this.saved=JT.Save.load();
  this.keys=new Set();this.input={dir:0,press:false,release:false,releaseDir:0};this.last=0;this.accumulator=0;this.saveClock=0;this.hudClock=0;this.storageWarned=false;this.ui=new JT.UI(this);
  this.ui.show('menu');this.resize();this.bind();this.frame=this.frame.bind(this);requestAnimationFrame(this.frame);
 }
 bind(){
  addEventListener('resize',()=>this.resize());
  addEventListener('keydown',e=>{
   if(e.target.matches('input')&&e.code!=='Escape')return;
   if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
   if(e.repeat)return;
   if(e.code==='Escape'){this.ui.escape();return;}
   if(e.code==='KeyH'){this.settings.hud=!this.settings.hud;this.persistSettings();this.ui.updateHud();return;}
   if(e.code==='KeyR'&&(this.session.mode==='playing'||this.session.mode==='paused')){
    if(this.session.mode==='playing')this.pause();this.ui.confirmKind='restart';this.ui.confirmReturn='paused';this.ui.show('confirm');return;
   }
   if(this.session.mode!=='playing')return;
   this.audio.unlock();this.keys.add(e.code);
   if(e.code==='Space')this.input.press=true;
  });
  addEventListener('keyup',e=>{this.keys.delete(e.code);if(e.code==='Space'&&this.session.mode==='playing'){this.input.release=true;this.input.releaseDir=this.direction();}});
  addEventListener('blur',()=>{if(this.session.mode==='playing')this.pause();this.clearInput();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(this.session.mode==='playing')this.pause();this.audio.suspend();}this.last=0;this.accumulator=0;});
  addEventListener('pagehide',()=>{if(this.session.mode!=='menu')this.save();});
 }
 resize(){
  // Keep pixels square and show the whole shaft; taller windows reveal more world.
  const height=Math.max(1,Math.round(C.width*innerHeight/innerWidth));
  JT.View.height=height;this.canvas.height=height;this.renderer.ctx.imageSmoothingEnabled=false;
  document.getElementById('stage').style.setProperty('--unit',Math.min(innerWidth/C.width,innerHeight/C.height)+'px');
  this.camera.y=JT.Util.clamp(this.camera.y,0,Math.max(0,C.worldHeight-height));this.camera.previous=this.camera.y;
 }

 direction(){return (this.keys.has('KeyD')||this.keys.has('ArrowRight')?1:0)-(this.keys.has('KeyA')||this.keys.has('ArrowLeft')?1:0);}
 clearInput(){this.keys.clear();this.input.dir=0;this.input.press=false;this.input.release=false;this.audio.stopCharge();}
 start(){this.clearInput();this.session.restart();this.camera.snap(this.session.player);this.renderer.oldX=this.session.player.x;this.renderer.oldY=this.session.player.y;this.renderer.particles.length=0;this.ui.lastRegion=-1;this.ui.lastArea=-1;this.accumulator=0;this.saveClock=0;this.audio.unlock();this.ui.show('');this.ui.updateHud();this.save();}
 continue(){if(!this.saved)return;this.clearInput();this.session.load(JT.Save.valid({version:C.version,player:this.saved.player,stats:this.saved.stats,completed:this.saved.completed}));this.camera.snap(this.session.player);this.renderer.oldX=this.session.player.x;this.renderer.oldY=this.session.player.y;this.ui.lastArea=-1;this.ui.lastRegion=-1;this.accumulator=0;this.audio.unlock();this.ui.show(this.session.completed?'victory':'');this.ui.updateHud();}
 pause(){if(this.session.pause()){this.clearInput();this.save();this.ui.show('paused');}}
 resume(){if(this.session.resume()){this.clearInput();this.accumulator=0;this.last=0;this.audio.unlock();this.ui.show('');}}
 menu(){if(this.session.mode!=='menu')this.save();this.clearInput();this.session.mode='menu';this.saved=JT.Save.load()||this.saved;this.ui.show('menu');}
 save(){const ok=JT.Save.store(this.session);this.saved=JT.Save.valid({version:C.version,player:this.session.player,stats:this.session.stats,completed:this.session.completed});if(!ok&&!this.storageWarned){this.storageWarned=true;this.ui.notice('Browser storage is unavailable. This journey will last only for this session.');}}
 persistSettings(){if(!JT.Save.saveSettings(this.settings)&&!this.storageWarned){this.storageWarned=true;this.ui.notice('Browser storage is unavailable. Settings will last only for this session.');}}
 frame(now){
  requestAnimationFrame(this.frame);if(document.hidden){this.last=0;return;}
  let dt=this.last?Math.min((now-this.last)/1000,0.1):0;this.last=now;
  const s=this.session,p=s.player;
  if(s.mode==='playing'){
   this.accumulator+=dt;
   while(this.accumulator>=C.step){
    this.input.dir=this.input.release?this.input.releaseDir:this.direction();
    this.renderer.oldX=p.x;this.renderer.oldY=p.y;s.tick(this.input);this.input.press=false;this.input.release=false;this.camera.tick(p,C.step);this.accumulator-=C.step;
    if(p.jumped){this.audio.sfx('jump');this.renderer.burst(p.x+6,p.y+20,'#c1c3a0',4);}
    if(p.landed){this.audio.sfx('land',p.impact/500);this.renderer.burst(p.x+6,p.y+20,JT.World.getRegion(p.y).top);if(p.impact>460&&this.settings.shake)this.renderer.shake=2.4;this.saveClock=C.saveInterval;}
    if(p.significantFall)this.audio.sfx('fall');
    if(s.completed){this.audio.stopCharge();this.audio.sfx('victory');this.save();this.ui.show('victory');break;}
   }
   this.audio.charge(p.charging?p.charge/C.maxCharge:-1);this.audio.tick(dt,true);this.saveClock+=dt;this.hudClock+=dt;
   if(this.saveClock>=C.saveInterval){this.saveClock=0;this.save();}
   if(this.hudClock>0.1){this.hudClock=0;this.ui.updateHud();}
  }
  if(s.mode==='menu')this.renderer.title(dt);
  else this.renderer.render(s,this.camera,s.mode==='playing'?this.accumulator/C.step:1,s.mode==='playing'||s.completed?dt:0);
 }
}
JT.Game=Game;JT.game=new Game();
})();

</script>
